name: Validate AI Agent Insights

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "LICENSE"
      - "references/**"
      - "examples/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill and build Agensi ZIP
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Install shared Codex and Antigravity workspace skill
        shell: pwsh
        run: .\scripts\install-workspace-skill.ps1

      - name: Verify shared workspace install
        shell: pwsh
        run: |
          $target = ".agents\skills\ai-agent-insights"
          if (-not (Test-Path "$target\SKILL.md")) { throw "Workspace skill missing" }
          $count = (Get-ChildItem "$target\references" -File -Recurse).Count
          if ($count -ne 5) { throw "Expected five skill reference files, found $count" }
          Write-Host "PASS: shared workspace installation contains SKILL.md and five references"

      - name: Validate sources and build package
        run: python scripts/validate_skill.py --build-package

      - name: Upload Agensi package
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-insights-0.1.0-agensi-zip
          path: dist/ai-agent-insights-0.1.0.zip
          if-no-files-found: error
          retention-days: 7
