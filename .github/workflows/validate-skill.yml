name: Validate AI Agent Insights

on:
  push:
    branches: [main]
    paths:
      - "SKILL.md"
      - "LICENSE"
      - "references/**"
      - "examples/**"
      - "scripts/**"
      - "requirements-dev.txt"
      - ".github/workflows/validate-skill.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate skill and build Agensi ZIP
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install -r requirements-dev.txt

      - name: Validate sources and build package
        run: python scripts/validate_skill.py --build-package

      - name: Upload Agensi package
        uses: actions/upload-artifact@v4
        with:
          name: ai-agent-insights-0.1.0-agensi-zip
          path: dist/ai-agent-insights-0.1.0.zip
          if-no-files-found: error
          retention-days: 7
